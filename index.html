
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Canal en Vivo</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      margin: 0;
      background-color: black;
    }
    video {
      width: 100%;
      height: 100vh;
      background: black;
    }
  </style>
</head>
<body>
  <video id="video" controls autoplay></video>
  <script>
    var video = document.getElementById('video');
    if (Hls.isSupported()) {
      var hls = new Hls();
      hls.loadSource('http://45.71.254.1:8000/play/a0e6/index.m3u8');
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = 'http://45.71.254.1:8000/play/a0e6/index.m3u8';
    }
  </script>
</body>
</html>
